name: Build Docker image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.platform }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux/amd64
          runner: ubuntu-latest
        - platform: linux/arm64
          runner: ubuntu-24.04-arm

    steps:
    - name: Check out repository
      uses: actions/checkout@v5

    - name: Prepare environment
      run: |
        echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
        platform="${{ matrix.platform }}"
        echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}

    - name: Build and push image by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
        cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

    - name: Export digest
      run: |
        mkdir -p "${{ runner.temp }}/digests"
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digest-${{ env.PLATFORM_PAIR }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    name: Push multi-platform manifest
    runs-on: ubuntu-latest
    needs: [build]

    steps:
    - name: Set image name
      run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: digest-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: index
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest

    - name: Create manifest list and push
      working-directory: ${{ runner.temp }}/digests
      run: |
        shopt -s nullglob
        args=()
        while IFS= read -r tag; do
          args+=(--tag "$tag")
        done < <(jq -r '.tags // [] | .[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
        while IFS= read -r annotation; do
          args+=(--annotation "$annotation")
        done < <(jq -r '.annotations // [] | .[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
        digests=(*)
        if [ ${#digests[@]} -eq 0 ]; then
          echo "No image digests found" >&2
          exit 1
        fi
        for digest in "${digests[@]}"; do
          args+=("${IMAGE_NAME}@sha256:${digest}")
        done
        docker buildx imagetools create "${args[@]}"

    - name: Inspect image
      run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
